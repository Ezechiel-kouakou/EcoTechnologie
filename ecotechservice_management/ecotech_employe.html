<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="ecotech_employe_style.css" />
    <title>Ecotech - employes space</title>
  </head>
  <body>
    <div id="authContainer">
      <form id="authForm">
         <h2>Espace Employé EcoTech</h2>

        <div class="auth-group">
            <i class="fa-solid fa-user"></i>
    <input type="text" name="nom" id="nom" placeholder="Nom" />
    </div>
    <div class="auth-group">
        <i class="fa-solid fa-user"></i>
    <input type="text" name="prenom" id="prenom" placeholder="Prénom" />
    </div>
    <div class="auth-group">
        <i class="fa-solid fa-envelope"></i>
    <input type="email" name="email" id="email" placeholder="Email" required />
    </div>
    <div class="auth-group">
        <i class="fa-solid fa-lock"></i>
    <input type="password" name="password" id="password" placeholder="Mot de passe" required />
</div>
   <div class="select-service">
    <select name="service" id="service">
        <option value="info">Service Informatique</option>
        <option value="customer">Service Client</option>
    </select>
</div>
<div class="conn-btn-reg-btn">
    <button type="button" onclick="handleAuth('register')" class="register">S'inscrire</button>
    <button type="button" onclick="handleAuth('login')" class="login">Se connecter</button>
    </div>
</form>
<!-- <a href="./service_pictures/customer_service_img.jpg"></a> -->
    <script src="ecotech_employe.js"></script>
  </body>
</html>
